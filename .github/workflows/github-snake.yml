# 🐍 Generate a custom pink/purple contribution snake daily → `output` branch.
name: Generate Snake

on:
  schedule:
    - cron: "30 0 * * *" # daily at 06:00 IST
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: deveshdusane
          outputs: |
            dist/github-snake.svg?color_snake=#d6336c&color_dots=#ffe3ef,#ffb3d1,#ff7ab0,#d6336c,#a855f7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4d8d&color_dots=#2a0a3d,#5b21b6,#7c3aed,#a855f7,#ff7ab0

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
