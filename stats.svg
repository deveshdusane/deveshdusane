  <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#a855f7"/>
  </linearGradient>
  <linearGradient id="shine1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="fr1"><rect width="480" height="210" rx="14"/></clipPath>
  <filter id="glow1" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
