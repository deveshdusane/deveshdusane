<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190" role="img" aria-label="Trophies">
<title>deveshdusane — trophies</title><style>
@keyframes fadeUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
@keyframes slideIn { from { opacity:0; transform: translateX(-16px); } to { opacity:1; transform: translateX(0); } }
@keyframes popIn { 0% { opacity:0; transform: scale(.5); } 70% { transform: scale(1.08); } 100% { opacity:1; transform: scale(1); } }
.row { opacity:0; animation: slideIn .55s ease-out forwards; }
.fade { opacity:0; animation: fadeUp .6s ease-out forwards; }
.cell { opacity:0; animation: popIn .55s cubic-bezier(.2,.9,.3,1.3) forwards; transform-box: fill-box; transform-origin: center; }
